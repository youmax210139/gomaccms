name: gomaccms

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: gomaccms_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: gomaccms:latest
    container_name: gomaccms_app
    restart: unless-stopped
    environment:
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}@(mysql:3306)/FilmSite?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      REDIS_DB: 0
      LISTENER_PORT: 3601
      # mysql / redis 已通过 healthcheck 确认就绪, 无需额外等待
      STARTUP_DELAY: 0
      # SEO 发布中心 (见 .env.example)
      SITEMAP_CHUNK_SIZE: ${SITEMAP_CHUNK_SIZE:-50000}
      SITEMAP_AUTO_INTERVAL: ${SITEMAP_AUTO_INTERVAL:-60}
      RSS_LIMIT: ${RSS_LIMIT:-50}
      RSS_CACHE_TTL: ${RSS_CACHE_TTL:-300}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_HOST: ${INDEXNOW_HOST:-}
      INDEXNOW_BATCH_SIZE: ${INDEXNOW_BATCH_SIZE:-10000}
    # 仅供 nginx 在内部网络访问
    expose:
      - "3601"
    volumes:
      # 卷名沿用 app_static 以保留已有上传数据; 卷内 upload/gallery 目录结构不变
      - app_static:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3601/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: gomaccms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: FilmSite
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=1
      - --tmp-table-size=512M
      - --max-heap-table-size=512M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gomaccms_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

# app / mysql / redis 仅在内部网络中访问, 只有 nginx 对外暴露端口
volumes:
  mysql_data:
  redis_data:
  app_static:
